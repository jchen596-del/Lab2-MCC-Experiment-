<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Listening Study</title>
  <link rel="stylesheet" href="styles.css?v=20260405b" />
</head>
<body>
  <main class="site-shell">
    <header class="masthead">
      <div class="masthead-copy">
        <p class="eyebrow">Online Study Session</p>
        <h1>Online Listening Study</h1>
        <p id="mastheadSubtitle" class="masthead-subtitle">
          Please read each screen carefully and continue when ready.
        </p>
      </div>
      <div class="masthead-progress" aria-label="Study progress">
        <div class="progress-copy">
          <span id="phaseLabel" class="phase-label">Phase 1</span>
          <strong id="screenLabel">Welcome</strong>
          <span id="progressText" class="progress-text">4% complete</span>
        </div>
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="progressFill"></span>
        </div>
        <div id="previewTools" class="preview-tools hidden"></div>
      </div>
    </header>

    <section id="app" class="app-root" aria-live="polite"></section>

    <noscript>
      <section class="card warning-card">
        <h2>JavaScript Required</h2>
        <p>This experiment interface is generated by the Lab 2 JavaScript modules. Please open it in a browser with JavaScript enabled.</p>
      </section>
    </noscript>
  </main>

  <script src="lab2-c3-transition-config.js?v=20260406b"></script>
  <script src="lab2-data.js?v=20260406b"></script>
  <script src="lab2-views-intro.js?v=20260406b"></script>
  <script src="lab2-views-study.js?v=20260406b"></script>
  <script src="lab2-views-finish.js?v=20260406b"></script>
  <script src="lab2-core.js?v=20260406b"></script>
</body>
</html>
